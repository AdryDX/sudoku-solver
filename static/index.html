<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sudoku Solver</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #1a2233;
    --border: #2c3a55;
    --text: #e8edf5;
    --muted: #8a97ad;
    --accent: #4f8cff;
    --ok: #35c37c;
    --warn: #e8b23c;
    --err: #ef5d6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 { font-size: 1.7rem; margin: 1.2rem 0 0.2rem; }
  .subtitle { color: var(--muted); margin: 0 0 1rem; font-size: 0.95rem; }
  main {
    display: flex;
    gap: 2.2rem;
    flex-wrap: wrap;
    justify-content: center;
    padding: 0 1rem 2rem;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem;
    width: 380px;
  }
  .panel h2 { font-size: 1.05rem; margin: 0 0 0.8rem; }
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 1.4rem 1rem;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  #dropzone.drag, #dropzone:hover { border-color: var(--accent); background: #20304d; color: var(--text); }
  #preview { max-width: 100%; max-height: 320px; margin-top: 0.8rem; border-radius: 8px; display: none; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.6rem 1.1rem;
    font-size: 0.95rem;
    cursor: pointer;
    margin-top: 0.8rem;
  }
  button:disabled { background: #33415c; cursor: not-allowed; }
  button.secondary { background: #33415c; }
  #grid {
    border-collapse: collapse;
    margin-top: 0.4rem;
    display: grid;
    grid-template-columns: repeat(9, 38px);
    gap: 0;
    user-select: none;
  }
  .cell {
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.15rem;
    border: 1px solid var(--border);
    cursor: text;
  }
  .cell:nth-child(9n+1), .cell:nth-child(9n+2), .cell:nth-child(9n+3) { border-left-width: 3px; }
  .cell:nth-child(9n+4), .cell:nth-child(9n+5), .cell:nth-child(9n+6) { border-left: 2px solid var(--border); }
  .cell:nth-child(n+55) { border-top: 3px solid var(--border); }
  .cell:nth-child(n+28):nth-child(-n+36), .cell:nth-child(n+55):nth-child(-n+63) { border-top: 2px solid var(--border); }
  .cell[data-original="1"] { color: var(--text); font-weight: 700; }
  .cell[data-original="0"] { color: var(--ok); }
  .cell[data-uncertain="1"] { background: #3d3622; outline: 1px solid var(--warn); outline-offset: -2px; }
  .cell.editing { background: #20304d; }
  #status { min-height: 1.3rem; font-size: 0.9rem; margin-top: 0.7rem; }
  #status.error { color: var(--err); }
  #status.ok { color: var(--ok); }
  .legend { display: flex; gap: 1rem; color: var(--muted); font-size: 0.8rem; margin-top: 0.6rem; }
  .legend span::before { content: "■ "; }
  .legend .l-given::before { color: var(--text); }
  .legend .l-solved::before { color: var(--ok); }
  .legend .l-warn::before { color: var(--warn); }
</style>
</head>
<body>
<h1>Sudoku Solver</h1>
<p class="subtitle">Sube, arrastra o pega (Ctrl+V) una captura de un sudoku</p>
<main>
  <section class="panel">
    <h2>1. Imagen</h2>
    <div id="dropzone">Haz clic, arrastra aqui o pega con Ctrl+V</div>
    <input type="file" id="file" accept="image/*" hidden>
    <img id="preview" alt="Vista previa">
    <button id="extractBtn" disabled>Leer sudoku</button>
    <div id="imgStatus" class="status"></div>
  </section>

  <section class="panel">
    <h2>2. Matriz</h2>
    <div id="grid"></div>
    <button id="solveBtn" disabled>Resolver</button>
    <button id="clearBtn" class="secondary">Limpiar</button>
    <div id="status"></div>
    <div class="legend">
      <span class="l-given">Original</span>
      <span class="l-solved">Resuelto</span>
      <span class="l-warn">Dudoso (edita si falla)</span>
    </div>
  </section>
</main>
<script>
const N = 9;
const grid = [];
const uncertain = new Set();
let gridEl, statusEl, solveBtn, clearBtn, extractBtn, fileInput, preview, dropzone;

function init() {
  gridEl = document.getElementById("grid");
  statusEl = document.getElementById("status");
  solveBtn = document.getElementById("solveBtn");
  clearBtn = document.getElementById("clearBtn");
  extractBtn = document.getElementById("extractBtn");
  fileInput = document.getElementById("file");
  preview = document.getElementById("preview");
  dropzone = document.getElementById("dropzone");

  for (let r = 0; r < N; r++) {
    grid.push(new Array(N).fill(0));
    for (let c = 0; c < N; c++) renderCell(r, c);
  }

  dropzone.onclick = () => fileInput.click();
  fileInput.onchange = () => fileInput.files[0] && setImage(fileInput.files[0]);
  extractBtn.onclick = () => sendImage();
  solveBtn.onclick = solveSudoku;
  clearBtn.onclick = resetGrid;

  ["dragenter", "dragover"].forEach(ev =>
    dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add("drag"); })
  );
  ["dragleave", "drop"].forEach(ev =>
    dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove("drag"); })
  );
  dropzone.addEventListener("drop", e => e.dataTransfer.files[0] && setImage(e.dataTransfer.files[0]));
  window.addEventListener("paste", e => {
    const item = [...(e.clipboardData?.items || [])].find(i => i.type.startsWith("image/"));
    if (item) setImage(item.getAsFile());
  });
}

function renderCell(r, c) {
  const div = document.createElement("div");
  div.className = "cell";
  div.tabIndex = 0;
  div.dataset.row = r;
  div.dataset.col = c;
  div.textContent = grid[r][c] || "";
  div.onclick = () => startEdit(div);
  gridEl.appendChild(div);
  return div;
}

function cellDiv(r, c) {
  return gridEl.children[r * N + c];
}

function refreshCells() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const div = cellDiv(r, c);
    div.textContent = grid[r][c] || "";
    div.dataset.original = grid[r][c] ? "1" : "0";
    div.dataset.uncertain = uncertain.has(r + "," + c) ? "1" : "0";
  }
}

function startEdit(div) {
  div.contentEditable = "plaintext-only";
  div.classList.add("editing");
  div.focus();
  selectAll(div);
  div.onblur = () => commitEdit(div);
  div.onkeydown = e => commitEdit(div);
}

function selectAll(el) {
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
}

function commitEdit(div) {
  div.onblur = null;
  div.onkeydown = null;
  div.contentEditable = "false";
  div.classList.remove("editing");
  const r = +div.dataset.row, c = +div.dataset.col;
  const value = parseInt(div.textContent.trim(), 10);
  grid[r][c] = value >= 1 && value <= 9 ? value : 0;
  uncertain.delete(r + "," + c);
  refreshCells();
}

function setImage(file) {
  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
  preview.onload = () => { extractBtn.disabled = false; };
}

function resetGrid() {
  for (let r = 0; r < N; r++) grid[r].fill(0);
  uncertain.clear();
  refreshCells();
  setStatus("");
}

async function sendImage() {
  extractBtn.disabled = true;
  setStatus("Leyendo imagen...", "ok");
  const blob = await fetch(preview.src).then(r => r.blob());
  const form = new FormData();
  form.append("file", blob, "sudoku.png");
  try {
    const res = await fetch("/api/extract", { method: "POST", body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Error al leer la imagen");
    for (let r = 0; r < N; r++) grid[r] = data.grid[r].map(v => +v);
    uncertain.clear();
    (data.uncertain || []).forEach(([r, c]) => uncertain.add(r + "," + c));
    refreshCells();
    solveBtn.disabled = false;
    const count = grid.flat().filter(v => v).length;
    const warn = uncertain.size ? ` (${uncertain.size} dudosas, marcadss en amarillo)` : "";
    setStatus(`Detectadas ${count} pistas${warn}. Revisa y pulsa Resolver.`, "ok");
  } catch (err) {
    setStatus(String(err.message || err), "error");
  } finally {
    extractBtn.disabled = false;
  }
}

async function solveSudoku() {
  solveBtn.disabled = true;
  setStatus("Resolviendo...", "ok");
  try {
    const res = await fetch("/api/solve", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ grid })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail));
    for (let r = 0; r < N; r++) grid[r] = data.grid[r].map(v => +v);
    uncertain.clear();
    refreshCells();
    setStatus("Resuelto ✔", "ok");
  } catch (err) {
    setStatus(String(err.message || err), "error");
  } finally {
    solveBtn.disabled = false;
  }
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || "";
}

init();
</script>
</body>
</html>
